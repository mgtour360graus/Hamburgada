name: Verificar Hamburgada
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar JavaScript e página inicial
        run: |
          node --check dist/app.js
          node --check dist/data.js
          test -f index.html
          test -f dist/index.html
# A publicação é feita pelo GitHub Pages a partir da branch main, pasta raiz.
# index.html direciona para dist/ e mantém parâmetros e âncoras.
